        <meta property="og:image:width" content="512" />
        <meta property="og:image:height" content="512" />
        <meta property="og:image:alt" content="شعار أكاديمية أداء الأبطال العالمية للرياضة" />
        <meta property="og:locale" content="ar_AR" />

        <!-- Twitter card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="أكاديمية أداء الأبطال العالمية للرياضة" />
        <meta name="twitter:description" content="نظام إدارة أكاديمية أداء الأبطال العالمية - إدارة الأعضاء، الاشتراكات، الحضور، والفيديوهات التدريبية" />
        <meta name="twitter:image" content="https://adaa-alabtal.replit.app/images/icon-512x512.png" />

        <!-- PWA Meta Tags -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="أداء الأبطال" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="application-name" content="أكاديمية أداء الأبطال العالمية للرياضة" />
        <meta name="msapplication-TileColor" content="#1e40af" />
        <meta name="msapplication-tap-highlight" content="no" />
        <meta name="format-detection" content="telephone=no" />
        
        <!-- PWA Manifest - Dynamic based on path -->
        <link rel="manifest" id="pwa-manifest" href="%PUBLIC_URL%/manifest.json" />
        <script>
            // Dynamic manifest selection based on path
            (function() {
                var isPortal = window.location.pathname.startsWith('/portal');
                var manifestLink = document.getElementById('pwa-manifest');
                if (isPortal && manifestLink) {
                    manifestLink.href = '/manifest-portal.json';
                    // Update apple-mobile-web-app-title for portal
                    var appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
                    if (appleTitleMeta) {
                        appleTitleMeta.content = 'بوابة الأعضاء';
                    }
                    // Update theme color for portal
                    var themeColorMeta = document.querySelector('meta[name="theme-color"]');
                    if (themeColorMeta) {
                        themeColorMeta.content = '#0284c7';
                    }
                }
            })();
        </script>
        
        <!-- Apple Touch Icons -->
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/images/icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/images/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/images/icon-192x192.png" />
        
        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/images/icon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/images/icon-72x72.png" />
        
        <!-- Splash Screens for iOS -->
        <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/images/icon-512x512.png" />
        
        <title>أكاديمية أداء الأبطال العالمية للرياضة</title>


    </head>
