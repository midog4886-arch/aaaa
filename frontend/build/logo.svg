  <polygon points="55,45 57,50 62,50 58,54 60,59 55,56 50,59 52,54 48,50 53,50" fill="#F97316"/>
  <polygon points="145,45 147,50 152,50 148,54 150,59 145,56 140,59 142,54 138,50 143,50" fill="#F97316"/>
  
  <!-- Bottom Text Arc -->
  <text x="100" y="175" text-anchor="middle" fill="#1E3A8A" font-family="Arial" font-size="12" font-weight="bold">أكاديمية أداء الأبطال العالمية</text>
</svg>