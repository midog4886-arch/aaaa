services:
  app:
    build: .
    expose:
      - "8000"
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-champions}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_TLS: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      STRICT_TENANT_CONTEXT: "1"
      SESSION_SECRET: ${SESSION_SECRET:-${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}}
      PORT: "8000"
      APP_BASE_URL: ${APP_BASE_URL:-}
      REACT_APP_BACKEND_URL: ${APP_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
    volumes:
      - app_uploads:/app/uploads
      - app_backups:/app/backups
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # Optional branch WhatsApp provider. Activate only after supplying the
  # secrets and WAHA_BASE_URL=http://waha:3000 in the deployment environment.
  waha:
    profiles: [waha]
    image: devlikeapro/waha@sha256:280bdc8f860267a2488a45d00ec88529646f7468c0bf0283c595d6efdd1b5e3b
    expose:
      - "3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_FILES_FOLDER: /app/.media
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    restart: unless-stopped

  mongodb:
    image: mongo:7
    command:
      - bash
      - -ec
      - |
        if [ ! -f /data/db/.replica-key ]; then
          head -c 512 /dev/urandom | base64 > /data/db/.replica-key
        fi
        chmod 400 /data/db/.replica-key
        chown mongodb:mongodb /data/db/.replica-key
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/db/.replica-key --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-champions}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { quit(rs.status().myState === 1 ? 0 : 1); }
          catch (e) { if (e.code === 94) rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1); }"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  app_uploads:
  app_backups:
  mongodb_data:
  waha_sessions:
  waha_media:
